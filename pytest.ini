[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --junitxml=reports/junit.xml --html=reports/report.html
junit_family = xunit2
markers =
    lab: needs the emulated lab (Ubuntu VM, root, lab/setup_lab.sh)
    matrix: Module 1 connectivity matrix
    qualify: qualify_ap baseline for APs in lab/inventory.yaml
    failures: Module 2 induced failures + classifier
    vlan: Module 3 VLAN isolation
    perf: iperf3 throughput after a full join
    rf: range vs rate with a programmable attenuator (real radios only)
    faults: fault injection while connected (deauth, supplicant restart, link drop, security change)
    smarthome: IoT device behaviours (router reboot, password change, 2.4 GHz-only)
    android: Module 4, host only; run with -m android
